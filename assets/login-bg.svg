<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="space" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#0d1236"/><stop offset="0.55" stop-color="#070a1c"/><stop offset="1" stop-color="#04050c"/>
    </radialGradient>
    <radialGradient id="nebA" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c084fc" stop-opacity="0.35"/><stop offset="1" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebB" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#4ff2ff" stop-opacity="0.22"/><stop offset="1" stop-color="#4ff2ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebC" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff3df2" stop-opacity="0.18"/><stop offset="1" stop-color="#ff3df2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/><stop offset="0.25" stop-color="#4ff2ff" stop-opacity="0.55"/><stop offset="1" stop-color="#4ff2ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur30"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <g id="ship"><path d="M14 0L-8 -7 -3 0 -8 7z" fill="none" stroke-width="1.5"/></g>
  </defs>

  <rect width="1600" height="900" fill="url(#space)"/>

  <!-- nebulae -->
  <ellipse cx="300" cy="200" rx="520" ry="300" fill="url(#nebA)" filter="url(#blur30)"/>
  <ellipse cx="1350" cy="700" rx="600" ry="320" fill="url(#nebB)" filter="url(#blur30)"/>
  <ellipse cx="1250" cy="150" rx="380" ry="220" fill="url(#nebC)" filter="url(#blur30)"/>

  <!-- star field: three depths -->
  <g fill="#ffffff" opacity="0.35">
    <circle cx="120" cy="80" r="1"/><circle cx="260" cy="410" r="1"/><circle cx="380" cy="120" r="1"/><circle cx="540" cy="760" r="1"/><circle cx="690" cy="60" r="1"/><circle cx="820" cy="820" r="1"/><circle cx="960" cy="150" r="1"/><circle cx="1110" cy="480" r="1"/><circle cx="1260" cy="860" r="1"/><circle cx="1420" cy="330" r="1"/><circle cx="1530" cy="90" r="1"/><circle cx="70" cy="640" r="1"/><circle cx="450" cy="300" r="1"/><circle cx="1000" cy="640" r="1"/><circle cx="1330" cy="520" r="1"/><circle cx="200" cy="860" r="1"/><circle cx="1490" cy="760" r="1"/><circle cx="600" cy="480" r="1"/><circle cx="880" cy="380" r="1"/><circle cx="740" cy="230" r="1"/>
  </g>
  <g fill="#dbe7ff" opacity="0.7">
    <circle cx="180" cy="300" r="1.5"/><circle cx="330" cy="620" r="1.4"/><circle cx="500" cy="90" r="1.6"/><circle cx="640" cy="330" r="1.3"/><circle cx="760" cy="700" r="1.5"/><circle cx="930" cy="250" r="1.4"/><circle cx="1060" cy="90" r="1.6"/><circle cx="1180" cy="720" r="1.3"/><circle cx="1300" cy="380" r="1.5"/><circle cx="1470" cy="600" r="1.4"/><circle cx="1560" cy="220" r="1.5"/><circle cx="90" cy="500" r="1.3"/><circle cx="410" cy="820" r="1.5"/><circle cx="1010" cy="840" r="1.4"/><circle cx="1400" cy="40" r="1.3"/>
  </g>
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="240" cy="160" r="2.2"><animate attributeName="opacity" values="1;0.4;1" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="300" r="2"><animate attributeName="opacity" values="0.5;1;0.5" dur="4.3s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="780" r="2.4"><animate attributeName="opacity" values="1;0.3;1" dur="5.2s" repeatCount="indefinite"/></circle>
    <circle cx="1480" cy="480" r="2"><animate attributeName="opacity" values="0.6;1;0.6" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="560" r="1.8"><animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- the core, low and centred so the sign-in card sits above it -->
  <g transform="translate(800 690)">
    <!-- range aura and orbit rings -->
    <circle r="330" fill="#4ff2ff" opacity="0.03"/>
    <circle r="330" fill="none" stroke="#4ff2ff" stroke-opacity="0.12"/>
    <circle r="250" fill="none" stroke="#4ff2ff" stroke-opacity="0.08" stroke-dasharray="6 14">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="240s" repeatCount="indefinite"/>
    </circle>
    <circle r="180" fill="none" stroke="#c084fc" stroke-opacity="0.12" stroke-dasharray="2 10">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="150s" repeatCount="indefinite"/>
    </circle>
    <!-- shield ring: 24 segments -->
    <g fill="none" stroke="#4ff2ff" stroke-width="7" stroke-opacity="0.75" stroke-dasharray="21.4 5.6">
      <circle r="103"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="90s" repeatCount="indefinite"/>
    </g>
    <circle r="112" fill="none" stroke="#ffffff" stroke-opacity="0.25"/>
    <!-- hull plates -->
    <g fill="#141b3d" stroke="#ffffff" stroke-opacity="0.3">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="200s" repeatCount="indefinite"/>
      <path d="M60 4A60 60 0 0 1 32 52L44 72A84 84 0 0 0 84 6z"/><path d="M28 55A60 60 0 0 1 -28 55L-38 76A84 84 0 0 0 38 76z"/><path d="M-32 52A60 60 0 0 1 -60 4L-84 6A84 84 0 0 0 -44 72z"/>
      <path d="M-60 -4A60 60 0 0 1 -32 -52L-44 -72A84 84 0 0 0 -84 -6z"/><path d="M-28 -55A60 60 0 0 1 28 -55L38 -76A84 84 0 0 0 -38 -76z"/><path d="M32 -52A60 60 0 0 1 60 -4L84 -6A84 84 0 0 0 44 -72z"/>
    </g>
    <g fill="#5eead4" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="200s" repeatCount="indefinite"/>
      <path d="M58 6A56 56 0 0 1 34 48L42 62A72 72 0 0 0 72 8z"/><path d="M26 51A56 56 0 0 1 -26 51L-32 66A72 72 0 0 0 32 66z"/><path d="M-34 48A56 56 0 0 1 -58 6L-72 8A72 72 0 0 0 -42 62z"/><path d="M-58 -6A56 56 0 0 1 -34 -48L-42 -62A72 72 0 0 0 -72 -8z"/>
    </g>
    <!-- hex body -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="200s" repeatCount="indefinite"/>
      <polygon points="52,0 26,45 -26,45 -52,0 -26,-45 26,-45" fill="#0b1030" stroke="#ffffff" stroke-width="2.5" stroke-opacity="0.9"/>
      <polygon points="37,0 19,32 -19,32 -37,0 -19,-32 19,-32" fill="none" stroke="#4ff2ff" stroke-opacity="0.35"/>
    </g>
    <circle r="22" fill="none" stroke="#4ff2ff" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="3 5.6">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="40s" repeatCount="indefinite"/>
    </circle>
    <!-- core -->
    <circle r="70" fill="url(#coreGlow)" opacity="0.5"><animate attributeName="r" values="64;76;64" dur="4s" repeatCount="indefinite"/></circle>
    <circle r="9" fill="#4ff2ff" opacity="0.6"/>
    <circle r="5" fill="#ffffff"><animate attributeName="r" values="4.5;6;4.5" dur="4s" repeatCount="indefinite"/></circle>
    <!-- turrets -->
    <g stroke-width="2.5" stroke-linecap="round">
      <g transform="rotate(-90)"><line x1="70" y1="0" x2="98" y2="0" stroke="#ffffff"/><circle cx="70" r="6" fill="#141b3d" stroke="#ffffff" stroke-width="1.5"/></g>
      <g transform="rotate(30)"><line x1="70" y1="0" x2="92" y2="0" stroke="#ff3df2"/><circle cx="96" r="4" fill="none" stroke="#ff3df2" stroke-width="1.5"/><circle cx="70" r="6" fill="#141b3d" stroke="#ff3df2" stroke-width="1.5"/></g>
      <g transform="rotate(150)"><line x1="70" y1="0" x2="86" y2="0" stroke="#9be7ff"/><line x1="86" y1="0" x2="96" y2="-6" stroke="#9be7ff" stroke-width="1.5"/><line x1="86" y1="0" x2="96" y2="6" stroke="#9be7ff" stroke-width="1.5"/><circle cx="70" r="6" fill="#141b3d" stroke="#9be7ff" stroke-width="1.5"/></g>
    </g>
    <!-- laser beam out to a ship -->
    <line x1="80" y1="-46" x2="500" y2="-330" stroke="#ff3df2" stroke-width="4" stroke-opacity="0.2"/>
    <line x1="80" y1="-46" x2="500" y2="-330" stroke="#ff3df2" stroke-width="1.5" stroke-opacity="0.9"><animate attributeName="stroke-opacity" values="0.9;0.5;0.9" dur="0.8s" repeatCount="indefinite"/></line>
  </g>

  <!-- ships inbound -->
  <g filter="url(#glow)">
    <use href="#ship" transform="translate(1270 200) rotate(150)" stroke="#ff4d6d"><animateTransform attributeName="transform" type="translate" values="1270 200;1240 220" dur="6s" repeatCount="indefinite" additive="sum"/></use>
    <use href="#ship" transform="translate(1330 260) rotate(160)" stroke="#ff4d6d"/>
    <use href="#ship" transform="translate(1210 150) rotate(140)" stroke="#ff4d6d"/>
    <use href="#ship" transform="translate(260 700) rotate(-30)" stroke="#ffd166"/>
    <use href="#ship" transform="translate(300 740) rotate(-28)" stroke="#ffd166"/>
    <use href="#ship" transform="translate(230 760) rotate(-34)" stroke="#ffd166"/>
    <use href="#ship" transform="translate(280 790) rotate(-30)" stroke="#ffd166"/>
    <use href="#ship" transform="translate(1180 690) rotate(-150)" stroke="#c084fc"/>
    <use href="#ship" transform="translate(330 280) rotate(30)" stroke="#60a5fa"/>
    <use href="#ship" transform="translate(1420 520) rotate(-175)" stroke="#9ca3af" stroke-width="2"/>
  </g>

  <!-- warlord silhouette far right -->
  <g transform="translate(1430 430)" opacity="0.5" filter="url(#blur6)">
    <polygon points="40,0 12,12 0,40 -12,12 -40,0 -12,-12 0,-40 12,-12" fill="none" stroke="#ffd166" stroke-width="2"/>
    <circle r="14" fill="none" stroke="#ffd166"/>
  </g>

  <!-- vignette -->
  <rect width="1600" height="900" fill="url(#space)" opacity="0.25"/>
</svg>
